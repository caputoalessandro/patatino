    ${due ? `<button class="review fc-due" id="alldue"><div><b>Ripassa tutto</b><br><span style="font-size:14px">Le carte di tutti i mazzi in scadenza oggi</span></div><span class="count">${due}</span></button>` : ""}
    <div class="sec-h"><h3>Direzione</h3></div>
    <div class="seg" role="group" aria-label="Direzione delle carte">${FC_DIRS.map(([id, l]) => `<button class="seg-b ${(S.fcDir || "nl") === id ? "on" : ""}" data-dir="${id}" aria-pressed="${(S.fcDir || "nl") === id}">${l}</button>`).join("")}</div>
    <div id="dl"></div>
  </div>`);
  const dl = v.querySelector("#dl");
  FC_GROUPS.forEach(([g, gs]) => {
    const list = DECKS.filter(d => d.g === g);
    if(!list.length) return;
    dl.appendChild($(`<div class="sec-h"><h3>${esc(g)}</h3><span class="label">${esc(gs)}</span></div>`));
    const box = $(`<div class="decks"></div>`);
    list.forEach(d => {
      if(!deckReady(d)){
        const b = $(`<button class="deck locked"><span class="dk-t"><b>${esc(d.t)}</b><span>${esc(d.s)}</span></span>
          <span class="dk-r"><span class="fc-badge prem">${LOCK(14)} ${deckLocked(d) ? "Sostenitori" : "Da scaricare"}</span><span class="dk-n">${d.n} carte</span></span></button>`);
        b.onclick = () => unlockScreen();
        box.appendChild(b);
        return;
      }
      const st = fcStats(d), pct = Math.round(st.learned / st.total * 100);
      const badge = st.due ? `<span class="fc-badge due">${st.due} da ripassare</span>` : st.fresh === st.total ? `<span class="fc-badge">nuovo</span>` : st.fresh ? `<span class="fc-badge">${st.fresh} nuove</span>` : `<span class="fc-badge ok">al passo</span>`;
      const b = $(`<button class="deck"><span class="dk-t"><b>${esc(d.t)}</b><span>${esc(d.s)}</span></span>
        <span class="dk-r">${badge}<span class="dk-n">${st.learned}/${st.total} imparate</span><span class="meter"><i style="width:${pct}%"></i></span></span></button>`);
      b.onclick = () => studyDeck(d.id);
      box.appendChild(b);
    });
    dl.appendChild(box);
  });
  v.querySelectorAll(".seg-b").forEach(b => b.onclick = () => { S.fcDir = b.dataset.dir; save(); decksScreen(); });
  const ad = v.querySelector("#alldue"); if(ad) ad.onclick = () => studyDeck(null);
  v.appendChild(tabBar("cards"));
  mount(v);
}

let F = null;   // sessione di flashcard in corso
function studyDeck(id, all){
  if(id && !deckReady(DECKS.find(d => d.id === id) || {})) return unlockScreen();
  const decks = (id ? DECKS.filter(d => d.id === id) : DECKS).filter(deckReady);
  const t = today();
  let due = [], fresh = [];
  decks.forEach(d => d.cards.forEach(c => { const r = fcRec(d, c); if(!r) fresh.push({d, c}); else if(r.d <= t) due.push({d, c}); }));
  let list = shuffle(due).slice(0, FC_MAX);
  if(id) list = list.concat(fresh.slice(0, Math.min(FC_NEW, FC_MAX - list.length)));
  if(!list.length && all && id) list = shuffle(decks[0].cards.map(c => ({d:decks[0], c}))).slice(0, FC_MAX);
  if(!list.length) return fcNothing(id);
  F = {id, queue: list.map(x => Object.assign({}, x, {dir: fcDir(x.d)})), pos:0, known:0, seen:0, flipped:false, xp:0};
  screen({s:"cards", deck:id});
  fcRender();
}
function fcDir(deck){
  if(deck.kind === "dehet") return "nl";
  const d = S.fcDir || "nl";
  return d === "mix" ? (Math.random() < .5 ? "nl" : "it") : d;
}
function fcNothing(id){
  screen({s:"cards", deck:id});
  const v = $(`<div class="res pop">
    ${patatino("happy", 130)}
    <span class="label">${id ? esc(DECKS.find(d => d.id === id).t) : "Tutti i mazzi"}</span>
    <h2 class="fc-done-h">Tutto ripassato per oggi</h2>
    <p>Le prossime carte tornano nei prossimi giorni. Se vuoi, puoi ripassare lo stesso.</p>
    <div class="row">
      ${id ? `<button class="btn btn-lion" id="anyway">Ripassa comunque</button>` : ""}
      <button class="btn btn-ghost" id="dk">Torna ai mazzi</button>
    </div>
  </div>`);
  const a = v.querySelector("#anyway"); if(a) a.onclick = () => studyDeck(id, true);
  v.querySelector("#dk").onclick = decksScreen;
  mount(v);
}
function fcFaces(x){
  const [nl, it, ex] = x.c, d = x.d;
  if(d.kind === "dehet") return {front: nl, frontSay: null, back: x.c[1] + " " + nl, backSub: x.c[2], backSay: x.c[1] + " " + nl, frontIsNl:true};
  const nlSay = nl.replace(/↔/g, ",");
  const exSay = d.sayExtra && ex ? ex.replace(/[·]/g, ",").replace(/\(|\)/g, "") : null;
  if(x.dir === "it") return {front: it, back: nl, backSub: ex, backSay: exSay ? nlSay + ". " + exSay : nlSay, frontSay:null};
  return {front: nl, frontSay: nlSay, back: it, backSub: ex, backSay: exSay, frontIsNl:true};
}
function fcRender(){
  const x = F.queue[F.pos], d = x.d, fc = fcFaces(x);
  F.flipped = false;
  const p = F.pos / F.queue.length * 100;
  const isChoice = d.kind === "dehet";
  const v = $(`<div>
    <div class="ex-top">
      <button class="x" id="quit" aria-label="Esci dalle flashcard">${ICON.x}</button>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}"><i style="width:${p}%"></i></div>
      <span class="ex-count">${F.pos+1}/${F.queue.length}</span>
    </div>
    <div class="pop">
      <span class="label">${esc(d.t)}${x.again ? " · di nuovo" : ""}</span>
      <div class="fc-wrap">
        <button class="fc" id="card" aria-label="${isChoice ? "Carta" : "Tocca per girare la carta"}">
          <span class="fc-in">
            <span class="fc-face fc-f"><span class="fc-txt">${esc(fc.front)}</span>${isChoice ? `<span class="fc-hint">de o het?</span>` : `<span class="fc-hint">Tocca per girare</span>`}</span>
            <span class="fc-face fc-b"><span class="fc-txt">${esc(fc.back)}</span>${fc.backSub ? `<span class="fc-sub">${esc(fc.backSub)}</span>` : ""}<span class="fc-mark" id="mark"></span></span>
          </span>
        </button>
        ${fc.frontSay || fc.backSay ? `<button class="qsay fc-say" id="say" aria-label="Ascolta">${ICON.sound}</button>` : ""}
      </div>
    </div>
    <div class="dock"><div class="dock-in" id="dock">
      ${isChoice ? `<div class="fc-row"><button class="btn btn-ghost fc-art" data-a="de">de</button><button class="btn btn-ghost fc-art" data-a="het">het</button></div>`
                 : `<button class="btn btn-deep" id="flip">Gira la carta</button>`}
    </div></div>
    <div class="quiz-bg" aria-hidden="true">${patatino("wave", 240)}</div>
  </div>`);
  const card = v.querySelector("#card");
  const say = v.querySelector("#say");
  const speakSide = () => { const t = F.flipped ? (fc.backSay || fc.frontSay) : (fc.frontSay || null); if(t) play(t, {fresh:true}); else if(fc.backSay && F.flipped) play(fc.backSay, {fresh:true}); };
  if(say){ say.onclick = () => { const t = F.flipped ? (fc.backSay || fc.frontSay) : fc.frontSay; if(t) play(t); }; if(!fc.frontSay) say.hidden = true; }
  const flip = () => {
    if(F.flipped || isChoice) return;
    F.flipped = true; card.classList.add("flipped"); card.setAttribute("aria-label", "Carta girata");
    if(say) say.hidden = !(fc.backSay || fc.frontSay);
    if(fc.backSay && S.audio) play(fc.backSay, {fresh:true});
    const dock = v.querySelector("#dock");
    dock.innerHTML = `<div class="fc-row"><button class="btn btn-no" id="again">Non ancora</button><button class="btn btn-ok" id="know">Lo so</button></div>`;
    dock.querySelector("#again").onclick = () => fcAnswer(false);
    dock.querySelector("#know").onclick = () => fcAnswer(true);
  };
  card.onclick = flip;
  const fl = v.querySelector("#flip"); if(fl) fl.onclick = flip;
  v.querySelectorAll(".fc-art").forEach(b => b.onclick = () => {
    if(F.flipped) return;
    const ok = b.dataset.a === x.c[1];
    F.flipped = true; card.classList.add("flipped", ok ? "good" : "bad");
    v.querySelector("#mark").textContent = ok ? "Giusto!" : "Era «" + x.c[1] + "»";
    v.querySelectorAll(".fc-art").forEach(o => { o.disabled = true; if(o.dataset.a === x.c[1]) o.classList.add("right"); });
    if(fc.backSay && S.audio) play(fc.backSay, {fresh:true});
    if(say) say.hidden = false;
    const dock = v.querySelector("#dock");
    const next = $(`<button class="btn ${ok ? "btn-ok" : "btn-no"}" id="nx">Continua</button>`);
    next.onclick = () => fcAnswer(ok);
    dock.appendChild(next);
  });
  v.querySelector("#quit").onclick = decksScreen;
  mount(v);
  if(fc.frontSay && S.audio) play(fc.frontSay, {fresh:true});
}
function fcAnswer(ok){
  const x = F.queue[F.pos];
  S.fc = S.fc || {};
  const k = fcKey(x.d, x.c), r = S.fc[k];
  if(!x.again){ F.seen++; if(ok){ F.known++; F.xp += 2; } }
  let b;
  if(ok) b = x.again ? 1 : Math.min((r ? r.b : 0) + 1, FC_INT.length - 1);
  else b = 0;
  S.fc[k] = {b, d: addDays(FC_INT[b])};
  if(!ok && (x.tries || 0) < 2){
    const copy = Object.assign({}, x, {again:true, tries:(x.tries || 0) + 1});
    F.queue.splice(Math.min(F.pos + 4, F.queue.length), 0, copy);   // torna tra qualche carta
  }
  save();
  F.pos++;
  if(F.pos >= F.queue.length) return fcFinish();
  fcRender();
}
function fcFinish(){
  S.xp += F.xp; bumpDay(); save();
  const pct = F.seen ? Math.round(F.known / F.seen * 100) : 100;
  const id = F.id, deck = id ? DECKS.find(d => d.id === id) : null;
  const st = deck ? fcStats(deck) : {due: fcDueAll(), fresh: 0};
  const more = st.due + (deck ? st.fresh : 0);
  const v = $(`<div class="res pop">
    ${patatino(pct >= 80 ? "cheer" : pct >= 50 ? "happy" : "sad", 130)}
    <span class="label">${deck ? esc(deck.t) : "Ripasso di tutti i mazzi"}</span>
    <div class="score">${F.known}<small>/${F.seen}</small></div>
    <p>${pct >= 80 ? "Ottima memoria." : pct >= 50 ? "Bene, le carte difficili tornano presto." : "Le rivedrai presto: è così che si memorizza."}</p>
    <span class="xpgain">+${F.xp} XP · ${S.streak} ${S.streak === 1 ? "giorno" : "giorni"} di fila</span>
    <div class="row">
      ${more ? `<button class="btn btn-lion" id="more">Altre carte (${more})</button>` : ""}
      <button class="btn ${more ? "btn-ghost" : "btn-lion"}" id="dk">Torna ai mazzi</button>
    </div>
  </div>`);
  const m = v.querySelector("#more"); if(m) m.onclick = () => studyDeck(id);
  v.querySelector("#dk").onclick = decksScreen;
  mount(v);
}

/* ---------- ORDINE DELLE PAROLE: serie di esercizi con tessere a blocchi ---------- */
const WO_GROUPS = [
  ["La frase principale", ["v2","inv","tmp","q","niet"]],
  ["Più verbi nella frase", ["mod","sep","perf","te"]],
  ["Frasi complesse", ["sub","want","subfirst","rel","cluster"]]
];
// parole che restano maiuscole anche a metà frase (nomi propri, lingue, paesi): ricavate dai dati
let PROPER = null;
function properWords(){
  if(PROPER) return PROPER;
  PROPER = new Set();
  ORDER_SETS.forEach(st => st.items.forEach(x => [x.a].concat(x.alt || []).forEach(seq => seq.forEach((c, k) => {
    c.split(" ").forEach((w, j) => { if((k > 0 || j > 0) && /^[A-ZÀ-Ý]/.test(w)) PROPER.add(w); });
  }))));
  return PROPER;
}
// le tessere non devono rivelare quale blocco va all'inizio: niente maiuscola iniziale, salvo i nomi propri
function tileCase(c){
  const w = c.split(" ")[0];
  return properWords().has(w) ? c : c.charAt(0).toLowerCase() + c.slice(1);
}
function woItem(setId, i){
  const st = ORDER_SETS.find(x => x.id === setId), x = st.items[i];
  return {t:"order", wo:true, q:x.it, a:x.a, tiles:x.a.map(tileCase), alt:x.alt || [], start:x.start || 0, v:x.v || [], end:x.end || [], e:x.e, rule:st.rule, setTitle:st.t};
}
// schema della frase: il verbo coniugato e le parti che vanno in fondo
function woDiagram(it){
  const pills = it.a.map((c, k) => {
    const cls = it.v.includes(k) ? "pv" : it.end.includes(k) ? "pe" : "";
    return `<span class="wp ${cls}">${esc(c)}</span>`;
  }).join("");
  const leg = [it.v.length ? `<span class="wl"><i class="pv"></i>verbo coniugato</span>` : "", it.end.length ? `<span class="wl"><i class="pe"></i>in fondo</span>` : ""].join("");
  return `<div class="wdiag"><span class="cl">Frase giusta</span><div class="wpills">${pills}</div><div class="wleg">${leg}</div></div>`;
}
const woDone = () => ORDER_SETS.filter(s => ((S.wob || {})[s.id] || 0) >= 80).length;
function woScreen(){
  screen({s:"wo"});
  const v = $(`<div class="pop">
    <div class="lesson-h tab-h"><span class="label">Ordine delle parole</span><h2>Costruisci la frase</h2><p>In neerlandese ogni pezzo della frase ha il suo posto. Metti i blocchi nell'ordine giusto: dopo ogni risposta vedi dove va il verbo.</p></div>
    <div id="wl"></div>
  </div>`);
  const wl = v.querySelector("#wl");
  WO_GROUPS.forEach(([g, ids]) => {
    wl.appendChild($(`<div class="sec-h"><h3>${esc(g)}</h3></div>`));
    const box = $(`<div class="decks"></div>`);
    ids.forEach(id => {
      const st = ORDER_SETS.find(x => x.id === id); if(!st) return;
      const best = (S.wob || {})[id] || 0, u = unitById(st.unit), n = unitIndex(st.unit) + 1;
      const lk = setLocked(st);
      const badge = lk ? `<span class="fc-badge prem">${LOCK(14)} Sostenitori</span>` : best >= 80 ? `<span class="fc-badge ok">✓ ${best}%</span>` : best ? `<span class="fc-badge">${best}%</span>` : `<span class="fc-badge">nuovo</span>`;
      const b = $(`<button class="deck ${lk ? "locked" : ""}"><span class="dk-t"><b>${esc(st.t)}</b><span>${esc(st.s)}</span></span>
        <span class="dk-r">${badge}<span class="dk-n">${u ? "unità " + n : ""} · ${st.items.length || st.n || 0} frasi</span><span class="meter"><i style="width:${best}%"></i></span></span></button>`);
      b.onclick = () => startWo(id);
      box.appendChild(b);
    });
    wl.appendChild(box);
  });
  v.appendChild(tabBar("words"));
  mount(v);
}
function startWo(id){
  const st = ORDER_SETS.find(x => x.id === id);
  if(!setReady(st)) return unlockScreen();
  const list = st.items.map((x, i) => ({set:id, i, w:true, it:woItem(id, i)}));
  begin("wo", null, list, null, id);
}
function woFinish(){
  const pct = Math.round(R.first / R.total * 100), id = R.set;
  S.wob = S.wob || {}; S.wob[id] = Math.max(S.wob[id] || 0, pct);
  S.xp += R.xp; bumpDay(); save();
  const order = [].concat(...WO_GROUPS.map(g => g[1]));
  const nextId = order[order.indexOf(id) + 1];
  const st = ORDER_SETS.find(x => x.id === id), nx = nextId && ORDER_SETS.find(x => x.id === nextId);
  const v = $(`<div class="res pop">
    ${patatino(pct >= 80 ? "cheer" : pct >= 50 ? "happy" : "sad", 130)}
    <span class="label">Costruisci la frase · ${esc(st.t)}</span>
    <div class="score">${R.first}<small>/${R.total}</small></div>
    <p>${pct === 100 ? "Ordine perfetto." : pct >= 80 ? "Ottimo: la regola è tua." : pct >= 50 ? "Ci sei quasi. Riguarda lo schema dei verbi e riprova." : "Apri «Regola» durante l'esercizio e riprova."}</p>
    <span class="xpgain">+${R.xp} XP · ${S.streak} ${S.streak === 1 ? "giorno" : "giorni"} di fila</span>
    <div class="row">
      ${pct >= 80 && nx ? `<button class="btn btn-lion" id="nextw">Prossima serie · ${esc(nx.t)}</button>` : ""}
      <button class="btn ${pct >= 80 ? "btn-ghost" : "btn-lion"}" id="againw">Rifai la serie</button>
      ${S.wrong.length ? `<button class="btn btn-ghost" id="rv">Ripassa gli errori (${S.wrong.length})</button>` : ""}
      <button class="btn btn-ghost" id="wl">Tutte le serie</button>
    </div>
  </div>`);
  const on = (s, fn) => { const b = v.querySelector(s); if(b) b.onclick = fn; };
  on("#nextw", () => startWo(nextId));
  on("#againw", () => startWo(id));
  on("#rv", startReview);
  on("#wl", woScreen);
  mount(v);
}
